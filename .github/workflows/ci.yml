name: CI

# Soundcheck's own CI: build the engine + connectors, run corpus regression,
# and compare the routing model against pinned Kong on every PR/main push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The solver backend shells out to the `z3` CLI (`z3 -smt2 <file>`), so the
      # binary must be on PATH — not just an OCaml library.
      - name: Install z3
        run: sudo apt-get update && sudo apt-get install -y z3

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"

      # `yaml` is the only external opam dependency (`unix` ships with the
      # compiler). No .opam file yet, so install deps explicitly.
      - name: Install dependencies
        run: opam install --yes dune yaml

      - name: Build
        run: opam exec -- dune build

      - name: Test (corpus regression gate)
        run: opam exec -- dune test

  kong-conformance:
    name: Kong conformance (3.9.3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install conformance dependencies
        run: sudo apt-get update && sudo apt-get install -y z3 curl

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"

      - name: Install OCaml dependencies
        run: opam install --yes dune yaml

      # The harness pins the Kong image digest and runs both router flavors
      # sequentially. Missing Docker or a failing probe fails this job.
      - name: Run pinned Kong conformance
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check.sh conformance 2>&1 | tee "${RUNNER_TEMP}/kong-conformance.log"

      - name: Retain conformance output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kong-conformance-logs
          path: ${{ runner.temp }}/kong-conformance.log
          retention-days: 7

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proved frozen configuration
        uses: ./
        with:
          config: bench/kong/workflows/frozen-admin/repaired.yaml
          contract: bench/kong/contracts/admin-get.yaml

      - name: Violated frozen configuration
        id: violated
        continue-on-error: true
        uses: ./
        with:
          config: bench/kong/workflows/frozen-admin/unsafe.yaml
          contract: bench/kong/contracts/admin-get.yaml

      - name: Require the unsafe configuration to fail
        if: always()
        env:
          VIOLATED_OUTCOME: ${{ steps.violated.outcome }}
        run: test "$VIOLATED_OUTCOME" = failure
