name: Soundcheck verified security configuration
description: Verify a Kong or Kubernetes RBAC configuration against an immutable Soundcheck contract
author: Sourav Kumar

branding:
  icon: shield
  color: blue

inputs:
  connector:
    description: Trusted workflow-selected connector, kong or kubernetes-rbac; RBAC verifies the contract only, without before/after preservation
    required: false
    default: kong
  config:
    description: Path to the Kong declarative configuration or complete strict JSON RBAC snapshot, relative to the caller workspace
    required: true
  contract:
    description: Repository-relative path to the approved contract in the PR base commit or protected default-branch push commit
    required: true

runs:
  using: composite
  steps:
    - name: Require a fresh Action build switch
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${GITHUB_WORKSPACE:-}" != /* || ! -d "$GITHUB_WORKSPACE" ]]; then
          echo '::error::A checked-out workspace is required for the Action build.' >&2
          exit 1
        fi
        if [[ -e "$GITHUB_WORKSPACE/_opam" || -L "$GITHUB_WORKSPACE/_opam" ]]; then
          echo '::error::The Action requires a fresh job without preexisting workspace _opam state.' >&2
          exit 1
        fi

    - name: Set up OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: "5"
        opam-pin: false
        cache: false
        dune-cache: false

    - name: Install gate dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install --yes ca-certificates curl jq unzip

    - name: Install Z3 (4.16.0)
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/install-z3.sh"

    - name: Install Soundcheck dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: opam install --switch="$GITHUB_WORKSPACE" . --deps-only --yes

    - name: Build Soundcheck
      shell: bash
      working-directory: ${{ github.action_path }}
      run: opam exec --switch="$GITHUB_WORKSPACE" -- dune build cli/main.exe

    - name: Check regression solver
      shell: bash
      run: |
        set -euo pipefail
        opam exec --switch="$GITHUB_WORKSPACE" -- which z3
        soundcheck_z3_version="$(opam exec --switch="$GITHUB_WORKSPACE" -- z3 -version)"
        printf '%s\n' "$soundcheck_z3_version"
        test "$soundcheck_z3_version" = 'Z3 version 4.16.0 - 64 bit'

    - name: Verify frozen contract
      shell: bash
      env:
        SOUNDCHECK_CONNECTOR_INPUT: ${{ inputs.connector }}
        SOUNDCHECK_CONFIG_INPUT: ${{ inputs.config }}
        SOUNDCHECK_CONTRACT_INPUT: ${{ inputs.contract }}
      run: |
        bash "$GITHUB_ACTION_PATH/scripts/verify-approved-contract.sh"
