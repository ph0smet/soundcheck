# Unmodeled active HTTP plugins may affect routing, policy or targets.
# Profile v11 rejects the whole config rather than assuming cors is harmless.
# The known rate-limit plugin does not make the unknown plugin verifiable.
# Expected: UNKNOWN (unsupported plugin); configuration bytes are otherwise retained.
_format_version: "3.0"
services:
  - name: admin-api
    url: http://admin-backend
    routes:
      - name: admin-route
        paths:
          - /admin
        plugins:
          - name: cors
          - name: rate-limiting
