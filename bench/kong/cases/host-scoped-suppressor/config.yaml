# Negative-position regression: a host-scoped guard must not suppress an open
# route on other hosts. The accepted regex is also a runtime upper bound in
# profile v11, so it cannot act as a complete suppressor.
# Expected: conservative VIOLATED via admin-open.
_format_version: "3.0"
services:
  - name: admin-api
    url: http://admin-backend
    routes:
      - name: admin-guarded
        hosts:
          - admin.internal
        paths:
          - "~/admin"
        plugins:
          - name: key-auth
      - name: admin-open
        paths:
          - /admin
