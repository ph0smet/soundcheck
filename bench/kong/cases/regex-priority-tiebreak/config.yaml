# Preserved priority fixture: both shorthand languages are outside the shared
# router boundary. Explicit priority cannot justify a verdict for an unmodeled
# match language; neither route may be silently discarded.
# Expected: UNKNOWN (two unsupported regex paths), formerly PROVED.
_format_version: "3.0"
services:
  - name: admin-api
    url: http://admin-backend
    routes:
      - name: admin-guarded
        paths: ["~/admin/\\d+"]
        regex_priority: 100
        plugins:
          - name: key-auth
      - name: admin-open
        paths: ["~/admin/\\d+"]
        regex_priority: 1
