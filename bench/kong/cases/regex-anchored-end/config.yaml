# Preserved historical anchor fixture. Kong's two routers differ on final-LF
# handling for $, independently observed by the pinned conformance probe.
# Profile v11 fails the whole config closed instead of asserting exactness.
# Expected: UNKNOWN (unsupported trailing anchor).
_format_version: "3.0"
services:
  - name: admin-api
    url: http://admin-backend
    routes:
      - name: admin-deep
        paths:
          - /admin/1/secret
        plugins:
          - name: key-auth
      - name: admin-re
        paths:
          - "~/admin/\\d+$"
