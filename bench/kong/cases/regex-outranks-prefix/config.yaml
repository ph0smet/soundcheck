# Preserved historical regex-versus-prefix fixture. Shorthand Unicode membership
# differs between PCRE and the compatible router; priority does not resolve that
# semantic boundary. No assumption of ASCII-only requests is made.
# Expected: UNKNOWN (unsupported shorthand class).
_format_version: "3.0"
services:
  - name: admin-api
    url: http://admin-backend
    routes:
      - name: admin-regex
        paths: ["~/admin/\\d+"]
        plugins:
          - name: key-auth
      - name: admin-literal
        paths:
          - /admin/5
