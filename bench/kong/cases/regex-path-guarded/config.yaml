# Scenario: the SAME regex admin route as regex-path-explicit, but with key-auth
# attached. Guards against the lazy failure mode where every regex route is
# reported violated because its language is over-approximated to "anything":
# here the route is genuinely modelled and genuinely protected.
# Expected: PROVED (no-anonymous-access).
_format_version: "3.0"
services:
  - name: admin-api
    url: http://admin-backend
    routes:
      - name: admin-regex
        paths:
          - "~/admin/\\d+"
        plugins:
          - name: key-auth
