# Scenario: an admin route is exposed with no authentication plugin — the classic
# "forgot to lock down /admin". Anonymous requests reach it directly.
# Expected: VIOLATED (no-anonymous-access) via route "admin-route".
_format_version: "3.0"
services:
  - name: admin-api
    url: http://admin-backend
    routes:
      - name: admin-route
        paths:
          - /admin
        methods:
          - GET
          - POST
  - name: public-api
    url: http://public-backend
    routes:
      - name: public-route
        paths:
          - /public
