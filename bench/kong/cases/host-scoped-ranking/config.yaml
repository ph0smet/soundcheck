# Profile v11: accepted regexes are possible matches only because runtime failure
# cannot justify suppression. The open literal candidate remains reachable in
# the upper bound; this is not a claim that this specific regex fails in Kong.
# Expected: conservative VIOLATED via admin-narrow, formerly PROVED.
_format_version: "3.0"
services:
  - name: api
    url: http://backend
    routes:
      - name: admin-guarded
        hosts:
          - admin.example.com
        paths:
          - "~/admin"
        plugins:
          - name: key-auth
      - name: admin-narrow
        hosts:
          - admin.example.com
        paths:
          - /admin/5
