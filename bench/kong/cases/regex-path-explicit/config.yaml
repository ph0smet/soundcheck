# Preserved explicit-regex fixture: leading ~ selects regex syntax in Kong 3.x.
# The generic parser supports this language, but the shared connector boundary
# rejects shorthand classes whose Unicode membership differs across flavors.
# Expected: UNKNOWN (unsupported shorthand class).
_format_version: "3.0"
services:
  - name: admin-api
    url: http://admin-backend
    routes:
      - name: admin-regex
        paths:
          - "~/admin/\\d+"
