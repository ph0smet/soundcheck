# Legacy format 2.1 migrates this implicit regex to ~/admin(/.*)?.
# Migration is modeled, but dot has differing byte/Unicode behavior across
# the two supported router flavors.
# Expected: UNKNOWN (unsupported wildcard language).
_format_version: "2.1"
services:
  - name: admin-api
    url: http://admin-backend
    routes:
      - name: admin-implicit-regex
        paths:
          - /admin(/.*)?
